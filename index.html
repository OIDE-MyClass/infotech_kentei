<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情報技術検定 語句問題</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts (Inter & Noto Sans JP) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.35s ease-out forwards;
    }
    /* PC・タブレット横向きでは解答群の折りたたみを自動解除して常時表示 */
    @media (min-width: 1024px) {
      #quiz-wordbank.hidden {
        display: grid !important;
      }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 selection:bg-blue-200 flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-white/95 backdrop-blur-sm shadow-sm sticky top-0 z-20 flex-shrink-0">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <button id="btn-back" onclick="goBack()" class="hidden p-2 -ml-2 text-slate-500 hover:text-slate-800 rounded-full hover:bg-slate-100 transition-colors" aria-label="戻る">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </button>
        <h1 class="text-lg font-bold text-slate-700 flex items-center gap-2">
          <i data-lucide="book-open" class="w-6 h-6 text-blue-600"></i>
          <span>情報技術検定 語句問題</span>
        </h1>
      </div>
      <button onclick="goHome()" class="p-2 text-slate-500 hover:text-blue-600 rounded-full hover:bg-slate-100 transition-colors" aria-label="ホームへ戻る">
        <i data-lucide="home" class="w-6 h-6"></i>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-6xl mx-auto p-4 md:p-6 flex-grow w-full pb-24">
    
    <!-- デモモード通知バナー（GAS_URL未設定時のみ表示） -->
    <div id="demo-banner" class="hidden max-w-3xl mx-auto mb-6 bg-amber-50 border border-amber-200 text-amber-800 px-4 py-3 rounded-xl text-xs md:text-sm flex items-start gap-3">
      <i data-lucide="info" class="w-5 h-5 text-amber-600 flex-shrink-0 mt-0.5"></i>
      <div>
        <p class="font-bold">現在は動作確認用のサンプル問題を表示しています</p>
        <p class="mt-0.5 text-amber-700">HTMLコード内の <code class="bg-amber-100 px-1.5 py-0.5 rounded font-mono">GAS_URL</code> をご自身のウェブアプリURLに書き換えると、スプレッドシートの問題が読み込まれます。</p>
      </div>
    </div>

    <!-- 1. 読み込み中画面 -->
    <div id="view-loading" class="max-w-3xl mx-auto py-24 flex flex-col items-center justify-center text-slate-500">
      <i data-lucide="loader-2" class="w-10 h-10 animate-spin mb-4 text-blue-500"></i>
      <p class="font-bold">問題データを読み込み中...</p>
    </div>

    <!-- 2. エラー画面 -->
    <div id="view-error" class="hidden max-w-3xl mx-auto py-20 flex flex-col items-center justify-center p-6 text-center bg-white rounded-2xl border border-red-100 shadow-sm">
      <i data-lucide="alert-circle" class="w-12 h-12 text-red-500 mb-4"></i>
      <p class="font-bold text-slate-700 text-lg mb-2">データの読み込みに失敗しました</p>
      <p id="error-message" class="text-sm text-slate-500 mb-6"></p>
      <button onclick="initApp()" class="px-6 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition-colors">
        再読み込みする
      </button>
    </div>

    <!-- 3. ホーム画面 -->
    <div id="view-home" class="hidden max-w-3xl mx-auto space-y-8 animate-fade-in">
      <div class="text-center py-6 bg-blue-50 rounded-2xl border border-blue-100">
        <h2 class="text-xl font-bold text-blue-800 mb-2">スキマ時間で合格を目指そう！</h2>
        <p class="text-sm text-blue-600 px-4 leading-relaxed">
          本番と同じ「記号選択方式」で学習できます。<br>
          解答群から適切な語句の記号を選んでください。
        </p>
      </div>

      <!-- 実力テスト（力試し） -->
      <div id="mock-test-section" class="space-y-3">
        <h3 class="font-bold text-slate-500 text-sm px-2">実力テスト</h3>
        <button onclick="startMockTest()" class="w-full relative overflow-hidden bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-6 rounded-2xl shadow-md hover:shadow-lg hover:-translate-y-0.5 transition-all group text-left flex items-center justify-between">
          <div class="absolute top-0 right-0 p-4 opacity-10 transform translate-x-4 -translate-y-4 group-hover:scale-110 transition-transform pointer-events-none">
            <i data-lucide="trophy" class="w-28 h-28"></i>
          </div>
          <div class="relative z-10 flex items-center gap-5">
            <div class="bg-white/20 p-4 rounded-2xl backdrop-blur-sm flex-shrink-0">
              <i data-lucide="trophy" class="w-9 h-9 text-white"></i>
            </div>
            <div>
              <span class="block font-bold text-xl mb-1">力試し（総合テスト）</span>
              <span class="block text-blue-100 text-sm font-medium">全ジャンルからランダムに出題されます</span>
            </div>
          </div>
          <i data-lucide="chevron-right" class="w-7 h-7 text-blue-200 group-hover:text-white transition-colors relative z-10 flex-shrink-0"></i>
        </button>
      </div>

      <!-- 分野別カテゴリ一覧 -->
      <div class="space-y-4">
        <h3 class="font-bold text-slate-500 text-sm px-2">分野別に学習する</h3>
        <div id="category-list" class="grid gap-4 md:grid-cols-2">
          <!-- JSで動的に生成 -->
        </div>
      </div>
    </div>

    <!-- 4. サブカテゴリ選択画面 -->
    <div id="view-subcategory" class="hidden max-w-3xl mx-auto space-y-6 animate-fade-in">
      <div class="flex items-center gap-4 mb-4">
        <div id="subcat-header-icon" class="bg-blue-100 p-3.5 rounded-2xl text-blue-600">
          <!-- JSでアイコン挿入 -->
        </div>
        <h2 id="subcat-header-title" class="text-2xl font-bold text-slate-800"></h2>
      </div>

      <!-- 出題大問数の指定パネル -->
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2.5">
        <div class="flex items-center gap-2 text-xs md:text-sm font-bold text-slate-600">
          <i data-lucide="sliders-horizontal" class="w-4 h-4 text-blue-600"></i>
          <span>出題する大問数を選択（ランダム抽出）</span>
        </div>
        <div id="limit-selector" class="grid grid-cols-5 gap-2">
          <!-- JSで動的に生成 -->
        </div>
      </div>

      <div id="subcategory-list" class="grid gap-3">
        <!-- JSで動的に生成 -->
      </div>
    </div>

    <!-- 5. クイズ出題画面（スマホ：上部追従 / PC・タブレット横向き：左右2カラム固定） -->
    <div id="view-quiz" class="hidden w-full animate-fade-in">
      <!-- 進捗バー・ヘッダー -->
      <div class="mb-4 flex justify-between items-end">
        <span id="quiz-subcat-badge" class="text-xs font-bold px-2.5 py-1 rounded-md bg-slate-200 text-slate-600"></span>
        <span class="text-sm font-bold text-slate-600">
          大問 <span id="quiz-current-num" class="text-xl text-blue-600">1</span> / <span id="quiz-total-num">1</span>
        </span>
      </div>

      <!-- レスポンシブ2カラムグリッド -->
      <div class="lg:grid lg:grid-cols-12 lg:gap-6 lg:items-start">
        
        <!-- 左カラム上部：大問の説明・図・長文 -->
        <div class="lg:col-span-7 lg:col-start-1">
          <!-- 大問の説明文 -->
          <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 mb-6 shadow-sm">
            <p id="quiz-description" class="font-bold text-blue-900 leading-relaxed text-sm md:text-base whitespace-pre-wrap"></p>
          </div>

          <!-- 図・画像の表示枠 -->
          <div id="quiz-image-container" class="hidden mb-6 rounded-xl overflow-hidden border border-slate-200 shadow-sm bg-white p-3 text-center">
            <img id="quiz-image" src="" alt="問題の図" referrerpolicy="no-referrer" class="max-w-full h-auto mx-auto rounded-lg object-contain bg-slate-50" style="max-height: 300px;">
          </div>

          <!-- 長文テキストの表示枠 -->
          <div id="quiz-passage-container" class="hidden bg-white p-5 rounded-xl border border-slate-300 mb-6 shadow-sm">
            <p id="quiz-passage" class="text-slate-700 font-medium leading-loose text-sm md:text-base whitespace-pre-wrap tracking-wide"></p>
          </div>
        </div>

        <!-- 右カラム（PC・タブレット横向き）/ 上部追従（スマホ）：解答群 -->
        <div id="quiz-wordbank-wrapper" class="sticky top-16 lg:top-20 z-10 lg:col-span-5 lg:col-start-8 lg:row-start-1 lg:row-span-2 bg-white/95 backdrop-blur-sm p-3.5 md:p-5 rounded-xl border border-blue-200 mb-6 lg:mb-0 shadow-md transition-all">
          <div class="flex items-center justify-between border-b border-slate-100 pb-2 mb-3">
            <h4 class="text-xs md:text-sm font-bold text-blue-700 flex items-center gap-1.5">
              <i data-lucide="pin" class="w-4 h-4"></i>
              <span>【解答群】</span>
            </h4>
            <span class="hidden lg:inline text-[11px] text-slate-400">選択済みの記号は色が変わります</span>
            <button type="button" onclick="toggleWordbank()" id="btn-toggle-wordbank" class="lg:hidden text-xs font-bold text-slate-500 hover:text-blue-600 bg-slate-100 hover:bg-blue-50 px-2.5 py-1 rounded-lg transition-colors flex items-center gap-1">
              <i data-lucide="chevron-up" class="w-3.5 h-3.5"></i>
              <span>たたむ</span>
            </button>
          </div>
          <div id="quiz-wordbank" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-1 xl:grid-cols-2 gap-2 max-h-36 sm:max-h-48 lg:max-h-[calc(100vh-9rem)] overflow-y-auto pr-1">
            <!-- JSで動的に生成 -->
          </div>
        </div>

        <!-- 左カラム下部：小問リストとアクションボタン -->
        <div class="lg:col-span-7 lg:col-start-1">
          <!-- 小問リスト -->
          <div id="quiz-questions-list" class="space-y-6 mb-8">
            <!-- JSで動的に生成 -->
          </div>

          <!-- アクションボタン（採点 / 次へ） -->
          <div class="mb-8">
            <button id="btn-submit" onclick="submitAnswers()" disabled class="w-full py-4 rounded-xl font-bold text-lg shadow-md transition-all bg-slate-200 text-slate-400 cursor-not-allowed">
              すべての記号を選択してください
            </button>
            <button id="btn-next" onclick="nextTask()" class="hidden w-full py-4 bg-slate-800 text-white rounded-xl font-bold text-lg shadow-md hover:bg-slate-700 active:scale-[0.98] transition-all">
              次の大問へ進む
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- 6. 結果画面 -->
    <div id="view-result" class="hidden max-w-md mx-auto text-center space-y-8 animate-fade-in py-8">
      <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-3 bg-blue-500"></div>
        
        <div class="w-20 h-20 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6">
          <i data-lucide="award" class="w-10 h-10"></i>
        </div>
        
        <h2 class="text-2xl font-bold text-slate-800 mb-2">お疲れ様でした！</h2>
        <p id="result-subcat-name" class="text-slate-500 mb-6"></p>
        
        <div class="flex items-center justify-center gap-2 text-5xl font-black text-slate-800 mb-4">
          <span id="result-score" class="text-blue-600">0</span>
          <span class="text-2xl text-slate-400 font-medium">/</span>
          <span id="result-total" class="text-3xl text-slate-600">0</span>
        </div>
      </div>

      <div class="space-y-3">
        <button id="btn-restart-wrong" onclick="restartWrongQuiz()" class="hidden w-full py-4 bg-blue-600 text-white font-bold rounded-xl shadow-md hover:bg-blue-700 hover:shadow-lg transition-all active:scale-[0.98]">
          間違えた大問だけ復習する
        </button>
        <button onclick="restartSameQuiz()" class="w-full py-4 bg-slate-800 text-white font-bold rounded-xl shadow-md hover:bg-slate-700 hover:shadow-lg transition-all active:scale-[0.98]">
          同じ問題をもう一度解く
        </button>
        <button onclick="selectAnotherQuiz()" class="w-full py-4 bg-white text-slate-700 font-bold rounded-xl shadow-sm border border-slate-200 hover:bg-slate-50 transition-all active:scale-[0.98]">
          別の問題を選ぶ
        </button>
      </div>
    </div>

  </main>

  <script>
    // =========================================================================
    // GASのウェブアプリURL（設定済み）
    // =========================================================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxLv8FLUrq6EgcnMjezL_JzK7x7RS1MCfoOAI9KTb2TMZgS846tocVCtmj5RFavva4Q/exec";

    // 解答記号の一覧
    const KANA_BANK = ['ア', 'イ', 'ウ', 'エ', 'オ', 'カ', 'キ', 'ク', 'ケ', 'コ', 'サ', 'シ', 'ス', 'セ', 'ソ', 'タ', 'チ', 'ツ', 'テ', 'ト'];

    // カテゴリ名に応じたLucideアイコン名のマッピング
    const CATEGORY_ICONS = {
      'ハードウェア系': 'cpu',
      'ソフトウェア系': 'monitor',
      'マルチメディア系': 'globe'
    };

    // URL未設定時の動作確認用サンプルデータ
    const SAMPLE_DATA = {
      "ハードウェア系": {
        "コンピュータの構成と動作": [
          {
            description: "次の(1)～(3)の文の意味として適切な語句を、解答群から選びなさい。",
            passage: "",
            imageUrl: "",
            questions: [
              "主記憶装置から命令を取り出し、解読して各装置に制御信号を送る装置。",
              "電源を切ると記憶内容が消えてしまう揮発性のメモリで、主記憶装置に用いられる。",
              "CPUと主記憶装置の処理速度の差を埋めるために設けられる高速な記憶装置。"
            ],
            answers: ["制御装置", "RAM", "キャッシュメモリ"],
            wordBank: ["ROM", "RAM", "制御装置", "演算装置", "キャッシュメモリ", "補助記憶装置"]
          }
        ]
      },
      "ソフトウェア系": {
        "OSとソフトウェア": [
          {
            description: "次の文章の空欄(1)～(3)に入る最も適切な語句を、解答群から選びなさい。",
            passage: "コンピュータを動作させるための基本的なソフトウェアを( 1 )と呼ぶ。代表的なものとしてWindowsやmacOSがある。\n( 1 )は、ハードウェアと( 2 )ソフトウェアの間を取り持ち、システム全体を管理する役割を持つ。また、ハードウェアを直接制御するために必要なプログラムを( 3 )という。",
            imageUrl: "",
            questions: ["", "", ""],
            answers: ["OS（オペレーティングシステム）", "応用（アプリケーション）", "デバイスドライバ"],
            wordBank: ["デバイスドライバ", "コンパイラ", "OS（オペレーティングシステム）", "応用（アプリケーション）", "ファームウェア"]
          }
        ]
      },
      "マルチメディア系": {
        "情報の表現とマルチメディア": [
          {
            description: "次の(1)～(2)の文の意味として適切な語句を、解答群から選びなさい。",
            passage: "",
            imageUrl: "",
            questions: [
              "画像を構成する最小単位の点（画素）のこと。",
              "静止画の圧縮形式の一つで、写真などの自然画の保存によく使われる非可逆圧縮方式。"
            ],
            answers: ["ピクセル", "JPEG"],
            wordBank: ["ピクセル", "解像度", "JPEG", "PNG", "MIDI"]
          }
        ]
      }
    };

    // アプリケーション全体の状態管理
    let state = {
      quizData: null,
      currentView: 'loading',
      selectedMainCategory: null,
      selectedSubCategory: null,
      selectedQuestionLimit: 'all',
      taskSets: [],
      wrongTasks: [],
      currentTaskIndex: 0,
      userAnswers: [],
      isSubmitted: false,
      score: 0,
      totalQuestionsCount: 0
    };

    // 初期化処理（ページ読み込み完了時に実行）
    window.addEventListener('DOMContentLoaded', () => {
      initApp();
    });

    async function initApp() {
      switchView('loading');
      document.getElementById('demo-banner').classList.add('hidden');

      // GAS_URLが未設定の場合はサンプルデータで起動
      if (!GAS_URL || GAS_URL === "YOUR_WEB_APP_URL") {
        state.quizData = SAMPLE_DATA;
        document.getElementById('demo-banner').classList.remove('hidden');
        renderHome();
        switchView('home');
        return;
      }

      // GASからJSONデータを取得
      try {
        const response = await fetch(GAS_URL);
        if (!response.ok) {
          throw new Error(`HTTPエラー: ${response.status}`);
        }
        const data = await response.json();
        state.quizData = data;
        renderHome();
        switchView('home');
      } catch (error) {
        console.error("Fetch error:", error);
        document.getElementById('error-message').textContent = 
          "通信環境やGASのURL（末尾が /exec になっているか、アクセス権限が「全員」になっているか）を確認してください。";
        switchView('error');
      }
    }

    // 画面切り替え制御
    function switchView(viewName) {
      state.currentView = viewName;
      const views = ['loading', 'error', 'home', 'subcategory', 'quiz', 'result'];
      views.forEach(v => {
        const el = document.getElementById(`view-${v}`);
        if (el) {
          if (v === viewName) {
            el.classList.remove('hidden');
          } else {
            el.classList.add('hidden');
          }
        }
      });

      // 戻るボタンの表示制御
      const backBtn = document.getElementById('btn-back');
      if (viewName === 'home' || viewName === 'loading' || viewName === 'error') {
        backBtn.classList.add('hidden');
      } else {
        backBtn.classList.remove('hidden');
      }

      lucide.createIcons();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 配列のランダムシャッフル（フィッシャー–イェーツ法）
    function shuffleArray(array) {
      const newArray = [...array];
      for (let i = newArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
      }
      return newArray;
    }

    // Google Driveの画像URLを表示用サムネイルURLに変換
    function formatImageUrl(url) {
      if (!url) return "";
      if (url.includes('drive.google.com')) {
        const idMatch = url.match(/[?&]id=([^&]+)/) || url.match(/\/d\/([^/]+)/);
        if (idMatch && idMatch[1]) {
          return `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w800`;
        }
      }
      return url;
    }

    // HTMLエスケープ処理
    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // --- ホーム画面の描画 ---
    function renderHome() {
      const categoryListEl = document.getElementById('category-list');
      const mockSectionEl = document.getElementById('mock-test-section');
      const categories = Object.keys(state.quizData || {});

      if (categories.length === 0) {
        mockSectionEl.classList.add('hidden');
        categoryListEl.innerHTML = `
          <div class="col-span-full bg-white p-8 rounded-2xl text-center text-slate-500 border border-slate-200">
            まだ問題が登録されていません。Googleフォームから問題を追加してください。
          </div>
        `;
        return;
      }

      mockSectionEl.classList.remove('hidden');
      categoryListEl.innerHTML = categories.map(catName => {
        const iconName = CATEGORY_ICONS[catName] || 'book-open';
        return `
          <button onclick="selectMainCategory('${escapeHtml(catName)}')" class="flex items-center justify-between p-5 bg-white rounded-2xl shadow-sm border border-slate-200 hover:border-blue-400 hover:shadow-md hover:-translate-y-0.5 transition-all group text-left">
            <div class="flex items-center gap-5">
              <div class="bg-blue-100 p-4 rounded-2xl text-blue-600 group-hover:bg-blue-600 group-hover:text-white transition-colors flex-shrink-0">
                <i data-lucide="${iconName}" class="w-9 h-9"></i>
              </div>
              <span class="font-bold text-xl text-slate-800">${escapeHtml(catName)}</span>
            </div>
            <i data-lucide="chevron-right" class="w-7 h-7 text-slate-400 group-hover:text-blue-500 transition-colors flex-shrink-0"></i>
          </button>
        `;
      }).join('');
    }

    // --- メインカテゴリ選択 ---
    function selectMainCategory(catName) {
      state.selectedMainCategory = catName;
      const iconName = CATEGORY_ICONS[catName] || 'book-open';
      
      document.getElementById('subcat-header-icon').innerHTML = `<i data-lucide="${iconName}" class="w-7 h-7"></i>`;
      document.getElementById('subcat-header-title').textContent = catName;

      renderLimitSelector();
      renderSubCategoryList();
      switchView('subcategory');
    }

    // 出題大問数セレクターの描画
    function renderLimitSelector() {
      const options = [
        { value: 'all', label: 'すべて' },
        { value: 1, label: '1問' },
        { value: 2, label: '2問' },
        { value: 3, label: '3問' },
        { value: 5, label: '5問' }
      ];

      const selectorEl = document.getElementById('limit-selector');
      selectorEl.innerHTML = options.map(opt => {
        const isSelected = state.selectedQuestionLimit === opt.value;
        const btnClass = isSelected
          ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
          : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100';
        const arg = opt.value === 'all' ? "'all'" : opt.value;
        return `
          <button onclick="setQuestionLimit(${arg})" class="py-2 px-1 rounded-xl text-xs md:text-sm font-bold border transition-all ${btnClass}">
            ${opt.label}
          </button>
        `;
      }).join('');
    }

    // 出題大問数の変更
    function setQuestionLimit(limit) {
      state.selectedQuestionLimit = limit;
      renderLimitSelector();
      renderSubCategoryList();
    }

    // サブカテゴリ一覧の描画
    function renderSubCategoryList() {
      const catName = state.selectedMainCategory;
      const subCats = Object.keys(state.quizData[catName]);
      const subcatListEl = document.getElementById('subcategory-list');

      subcatListEl.innerHTML = subCats.map(subName => {
        const sets = state.quizData[catName][subName];
        const qCount = sets.reduce((acc, set) => acc + set.questions.length, 0);
        
        let badgeText = `大問${sets.length}つ (全${qCount}問)`;
        if (state.selectedQuestionLimit !== 'all') {
          const actualCount = Math.min(sets.length, Number(state.selectedQuestionLimit));
          badgeText = `${actualCount}問出題 / 全${sets.length}大問`;
        }

        return `
          <button onclick="selectSubCategory('${escapeHtml(subName)}')" class="flex items-center justify-between p-5 bg-white rounded-xl shadow-sm border border-slate-200 hover:border-blue-500 hover:bg-blue-50 transition-all text-left group">
            <span class="font-semibold text-base md:text-lg text-slate-700 group-hover:text-blue-700">${escapeHtml(subName)}</span>
            <div class="flex items-center gap-2 flex-shrink-0 ml-2">
              <span class="text-xs font-medium text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full group-hover:bg-blue-200 group-hover:text-blue-800 transition-colors">
                ${badgeText}
              </span>
              <i data-lucide="chevron-right" class="w-5 h-5 text-slate-400 group-hover:text-blue-500"></i>
            </div>
          </button>
        `;
      }).join('');

      lucide.createIcons();
    }

    // --- サブカテゴリ選択（通常学習の開始） ---
    function selectSubCategory(subName) {
      const originalSets = state.quizData[state.selectedMainCategory][subName];
      let shuffledSets = shuffleArray(originalSets);

      // 指定された大問数で絞り込み
      if (state.selectedQuestionLimit !== 'all') {
        shuffledSets = shuffledSets.slice(0, Number(state.selectedQuestionLimit));
      }

      state.selectedSubCategory = subName;
      state.taskSets = shuffledSets;
      state.score = 0;
      state.totalQuestionsCount = shuffledSets.reduce((acc, set) => acc + set.questions.length, 0);

      initTask(0);
      switchView('quiz');
    }

    // --- 力試し（全ジャンル総合テスト）の開始 ---
    function startMockTest() {
      let mockSets = [];
      Object.keys(state.quizData).forEach(mainCat => {
        let allSetsInCat = [];
        Object.keys(state.quizData[mainCat]).forEach(subCat => {
          allSetsInCat = allSetsInCat.concat(state.quizData[mainCat][subCat]);
        });
        const shuffledCatSets = shuffleArray(allSetsInCat);
        // 各ジャンルからランダムに最大2問ピックアップ
        mockSets = mockSets.concat(shuffledCatSets.slice(0, 2));
      });

      state.selectedMainCategory = '力試し';
      state.selectedSubCategory = '全ジャンル総合テスト';
      state.taskSets = mockSets;
      state.score = 0;
      state.totalQuestionsCount = mockSets.reduce((acc, set) => acc + set.questions.length, 0);

      initTask(0);
      switchView('quiz');
    }

    // --- 大問の初期化と描画 ---
    function initTask(index) {
      if (index === 0) {
        state.wrongTasks = [];
      }
      state.currentTaskIndex = index;
      const currentTask = state.taskSets[index];
      state.userAnswers = new Array(currentTask.questions.length).fill(null);
      state.isSubmitted = false;

      // バッジと大問番号
      const badgeEl = document.getElementById('quiz-subcat-badge');
      badgeEl.textContent = state.selectedSubCategory;
      if (state.selectedMainCategory === '力試し') {
        badgeEl.className = "text-xs font-bold px-2.5 py-1 rounded-md bg-indigo-100 text-indigo-700";
      } else {
        badgeEl.className = "text-xs font-bold px-2.5 py-1 rounded-md bg-slate-200 text-slate-600";
      }

      document.getElementById('quiz-current-num').textContent = index + 1;
      document.getElementById('quiz-total-num').textContent = state.taskSets.length;
      document.getElementById('quiz-description').textContent = currentTask.description;

      // 画像の表示制御
      const imgContainer = document.getElementById('quiz-image-container');
      const imgEl = document.getElementById('quiz-image');
      if (currentTask.imageUrl) {
        imgEl.src = formatImageUrl(currentTask.imageUrl);
        imgEl.onerror = () => {
          imgContainer.innerHTML = '<div class="text-center p-4 text-red-500 text-sm">画像の読み込みに失敗しました</div>';
        };
        imgContainer.classList.remove('hidden');
      } else {
        imgEl.src = "";
        imgContainer.classList.add('hidden');
      }

      // 長文テキストの表示制御
      const passageContainer = document.getElementById('quiz-passage-container');
      const passageEl = document.getElementById('quiz-passage');
      if (currentTask.passage) {
        passageEl.textContent = currentTask.passage;
        passageContainer.classList.remove('hidden');
      } else {
        passageEl.textContent = "";
        passageContainer.classList.add('hidden');
      }

      // 解答群の初期化と描画
      const wordBankEl = document.getElementById('quiz-wordbank');
      const toggleBtn = document.getElementById('btn-toggle-wordbank');
      wordBankEl.classList.remove('hidden');
      if (toggleBtn) {
        toggleBtn.innerHTML = `<i data-lucide="chevron-up" class="w-3.5 h-3.5"></i><span>たたむ</span>`;
      }
      renderWordbank();

      // 小問とボタンの描画
      renderQuestions();
      updateActionButtons();
      lucide.createIcons();
    }

    // 解答群の描画（選択済み記号のハイライト対応）
    function renderWordbank() {
      const currentTask = state.taskSets[state.currentTaskIndex];
      const wordBankEl = document.getElementById('quiz-wordbank');
      const usedKanas = new Set(state.userAnswers.filter(Boolean));

      wordBankEl.innerHTML = currentTask.wordBank.map((word, idx) => {
        const kana = KANA_BANK[idx];
        const isUsed = usedKanas.has(kana);
        const itemClass = isUsed
          ? 'bg-blue-50/90 border-blue-200 text-slate-500'
          : 'bg-slate-50/60 border-transparent text-slate-700';

        return `
          <div class="flex items-start justify-between gap-1.5 px-2.5 py-1.5 rounded-lg border text-sm md:text-base transition-colors ${itemClass}">
            <div class="flex items-start gap-1.5">
              <span class="font-bold ${isUsed ? 'text-blue-400' : 'text-blue-600'} w-5 flex-shrink-0">${kana}.</span>
              <span class="leading-snug">${escapeHtml(word)}</span>
            </div>
            ${isUsed ? `<i data-lucide="check" class="w-4 h-4 text-blue-500 flex-shrink-0 mt-0.5"></i>` : ''}
          </div>
        `;
      }).join('');
    }

    // 解答群の折りたたみ切り替え
    function toggleWordbank() {
      const wordBankEl = document.getElementById('quiz-wordbank');
      const toggleBtn = document.getElementById('btn-toggle-wordbank');
      const isHidden = wordBankEl.classList.toggle('hidden');

      if (isHidden) {
        toggleBtn.innerHTML = `<i data-lucide="chevron-down" class="w-3.5 h-3.5"></i><span>開く</span>`;
      } else {
        toggleBtn.innerHTML = `<i data-lucide="chevron-up" class="w-3.5 h-3.5"></i><span>たたむ</span>`;
      }
      lucide.createIcons();
    }

    // 正解の記号を取得するヘルパー
    function getCorrectKana(task, qIndex) {
      const answerWord = task.answers[qIndex];
      const wordIndex = task.wordBank.indexOf(answerWord);
      return KANA_BANK[wordIndex];
    }

    // 小問リストの描画
    function renderQuestions() {
      const currentTask = state.taskSets[state.currentTaskIndex];
      const listEl = document.getElementById('quiz-questions-list');

      listEl.innerHTML = currentTask.questions.map((qText, qIdx) => {
        const correctKana = getCorrectKana(currentTask, qIdx);
        const userAns = state.userAnswers[qIdx];
        const isCorrect = state.isSubmitted && userAns === correctKana;
        const isWrong = state.isSubmitted && userAns !== correctKana;

        let cardBorderClass = 'border-slate-200 bg-white';
        if (isCorrect) cardBorderClass = 'border-green-400 bg-green-50/40';
        if (isWrong) cardBorderClass = 'border-red-400 bg-red-50/40';

        // 記号ボタンのHTML生成
        const buttonsHtml = currentTask.wordBank.map((_, wIdx) => {
          const kana = KANA_BANK[wIdx];
          const isSelected = userAns === kana;
          const isThisCorrect = state.isSubmitted && kana === correctKana;

          let btnClass = "w-10 h-10 md:w-11 md:h-11 rounded-full font-bold text-sm md:text-base transition-all border-2 flex items-center justify-center ";
          if (!state.isSubmitted) {
            if (isSelected) {
              btnClass += "bg-blue-600 text-white border-blue-600 shadow-md scale-105";
            } else {
              btnClass += "bg-white text-slate-600 border-slate-300 hover:bg-slate-100 active:scale-95";
            }
          } else {
            if (isSelected && isCorrect) {
              btnClass += "bg-green-500 text-white border-green-600";
            } else if (isSelected && isWrong) {
              btnClass += "bg-red-500 text-white border-red-600";
            } else if (!isSelected && isThisCorrect) {
              btnClass += "bg-white text-green-600 border-green-500 ring-2 ring-green-200";
            } else {
              btnClass += "bg-slate-50 text-slate-300 border-slate-200 opacity-50";
            }
          }

          return `
            <button onclick="selectAnswer(${qIdx}, '${kana}')" ${state.isSubmitted ? 'disabled' : ''} class="${btnClass}">
              ${kana}
            </button>
          `;
        }).join('');

        return `
          <div class="rounded-xl p-4 md:p-5 border-2 transition-all ${cardBorderClass}">
            <div class="flex gap-3 mb-4 items-center">
              <span class="font-bold text-slate-500 flex-shrink-0 text-lg">(${qIdx + 1})</span>
              ${qText 
                ? `<p class="text-sm md:text-base text-slate-800 flex-grow font-medium leading-relaxed">${escapeHtml(qText)}</p>` 
                : `<p class="text-sm text-slate-400 flex-grow italic">空欄(${qIdx + 1}) に当てはまる記号</p>`
              }
              ${isCorrect ? `<i data-lucide="check-circle-2" class="w-6 h-6 text-green-500 flex-shrink-0"></i>` : ''}
              ${isWrong ? `<i data-lucide="x-circle" class="w-6 h-6 text-red-500 flex-shrink-0"></i>` : ''}
            </div>

            <div class="flex flex-wrap gap-2">
              ${buttonsHtml}
            </div>

            ${isWrong ? `
              <div class="mt-4 text-sm text-red-600 bg-white p-3 rounded-lg border border-red-200 font-medium">
                正解：<span class="font-bold text-lg">${correctKana}</span>（${escapeHtml(currentTask.answers[qIdx])}）
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // 記号を選択したときの処理
    function selectAnswer(qIndex, kana) {
      if (state.isSubmitted) return;
      state.userAnswers[qIndex] = (state.userAnswers[qIndex] === kana) ? null : kana;
      renderWordbank();
      renderQuestions();
      updateActionButtons();
    }

    // 採点ボタン・次へボタンの状態更新
    function updateActionButtons() {
      const btnSubmit = document.getElementById('btn-submit');
      const btnNext = document.getElementById('btn-next');

      if (!state.isSubmitted) {
        btnSubmit.classList.remove('hidden');
        btnNext.classList.add('hidden');

        const isAllAnswered = state.userAnswers.every(ans => ans !== null);
        if (isAllAnswered) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = "採点する";
          btnSubmit.className = "w-full py-4 rounded-xl font-bold text-lg shadow-md transition-all bg-blue-600 text-white hover:bg-blue-700 active:scale-[0.98] cursor-pointer";
        } else {
          btnSubmit.disabled = true;
          btnSubmit.textContent = "すべての記号を選択してください";
          btnSubmit.className = "w-full py-4 rounded-xl font-bold text-lg shadow-md transition-all bg-slate-200 text-slate-400 cursor-not-allowed";
        }
      } else {
        btnSubmit.classList.add('hidden');
        btnNext.classList.remove('hidden');
        btnNext.textContent = (state.currentTaskIndex < state.taskSets.length - 1) ? "次の大問へ進む" : "結果を見る";
      }
    }

    // 採点実行
    function submitAnswers() {
      state.isSubmitted = true;
      const currentTask = state.taskSets[state.currentTaskIndex];
      let correctCount = 0;

      state.userAnswers.forEach((ansKana, idx) => {
        if (ansKana === getCorrectKana(currentTask, idx)) {
          correctCount++;
        }
      });

      // 1問でも間違いがあった大問を復習リストに保存
      if (correctCount < currentTask.questions.length) {
        state.wrongTasks.push(currentTask);
      }

      state.score += correctCount;
      renderQuestions();
      updateActionButtons();
    }

    // 次の大問へ、または結果画面へ
    function nextTask() {
      if (state.currentTaskIndex < state.taskSets.length - 1) {
        initTask(state.currentTaskIndex + 1);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        showResult();
      }
    }

    // 結果画面の表示
    function showResult() {
      document.getElementById('result-subcat-name').textContent = `${state.selectedSubCategory} の結果`;
      const scoreEl = document.getElementById('result-score');
      scoreEl.textContent = state.score;
      document.getElementById('result-total').textContent = state.totalQuestionsCount;

      if (state.score === state.totalQuestionsCount && state.totalQuestionsCount > 0) {
        scoreEl.className = "text-green-500";
      } else {
        scoreEl.className = "text-blue-600";
      }

      // 間違えた大問がある場合のみ復習ボタンを表示
      const wrongBtn = document.getElementById('btn-restart-wrong');
      if (state.wrongTasks.length > 0) {
        wrongBtn.classList.remove('hidden');
        wrongBtn.innerHTML = `
          <i data-lucide="rotate-ccw" class="w-5 h-5 inline-block mr-1.5 -mt-0.5"></i>
          間違えた大問だけ復習する（${state.wrongTasks.length}問）
        `;
      } else {
        wrongBtn.classList.add('hidden');
      }

      switchView('result');
    }

    // 間違えた大問だけを解きなおす
    function restartWrongQuiz() {
      if (state.wrongTasks.length === 0) return;
      state.taskSets = [...state.wrongTasks];
      state.score = 0;
      state.totalQuestionsCount = state.taskSets.reduce((acc, set) => acc + set.questions.length, 0);
      initTask(0);
      switchView('quiz');
    }

    // 結果画面からのアクション
    function restartSameQuiz() {
      state.score = 0;
      initTask(0);
      switchView('quiz');
    }

    function selectAnotherQuiz() {
      if (state.selectedMainCategory === '力試し') {
        goHome();
      } else {
        switchView('subcategory');
      }
    }

    // ナビゲーション制御
    function goHome() {
      state.selectedMainCategory = null;
      state.selectedSubCategory = null;
      switchView('home');
    }

    function goBack() {
      if (state.currentView === 'subcategory') {
        goHome();
      } else if (state.currentView === 'quiz' || state.currentView === 'result') {
        if (state.selectedMainCategory === '力試し') {
          goHome();
        } else {
          switchView('subcategory');
        }
      }
    }
  </script>
</body>
</html>
